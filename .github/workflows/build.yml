name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # A tag like v1.2.3 becomes version 1.2.3; other builds keep the .wixproj default.
      - name: Work out version
        id: version
        shell: pwsh
        run: |
          $v = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME -replace '^v', '' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test, publish and build installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          if ($version) { ./build-release.ps1 -Version $version } else { ./build-release.ps1 }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NetworkProfiles-${{ steps.version.outputs.value || github.sha }}
          path: |
            publish/*.exe
            installer/bin/x64/Release/*.msi
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Network Profiles ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            $(find dist -type f \( -name '*.exe' -o -name '*.msi' \))
